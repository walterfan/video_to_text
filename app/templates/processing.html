{% extends "base.html" %}

{% block title %}Processing Video{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Processing Your Audio or Video file</h1>
    <p class="lead">Please wait while we process your video...</p>
</div>

<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Processing Status</h3>
            </div>
            <div class="panel-body">
                <div class="progress">
                    <div class="progress-bar progress-bar-striped active" role="progressbar" 
                         aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%">
                        <span id="progress-text">0%</span>
                    </div>
                </div>
                
                <div class="text-center" style="margin-top: 20px;">
                    <h4 id="current-step">Starting...</h4>
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
                
                <div id="error-message" class="alert alert-danger" style="display: none;">
                    <strong>Error:</strong> <span id="error-text"></span>
                </div>
            </div>
        </div>
        
        <div class="text-center">
            <a href="{{ url_for('index') }}" class="btn btn-default">Back to Upload</a>
        </div>
    </div>
</div>

<script>
const jobId = "{{ job_id }}";
let pollInterval;

function updateStatus() {
    fetch(`/status/${jobId}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                showError(data.error);
                return;
            }
            
            const progress = data.progress || 0;
            const currentStep = data.current_step || 'Processing...';
            
            // Update progress bar
            const progressBar = document.querySelector('.progress-bar');
            const progressText = document.getElementById('progress-text');
            progressBar.style.width = progress + '%';
            progressBar.setAttribute('aria-valuenow', progress);
            progressText.textContent = progress + '%';
            
            // Update current step
            document.getElementById('current-step').textContent = currentStep;
            
            // Check if completed
            if (data.status === 'completed') {
                clearInterval(pollInterval);
                window.location.href = `/results/${jobId}`;
            } else if (data.status === 'error') {
                clearInterval(pollInterval);
                showError(data.error || 'An unknown error occurred');
            }
        })
        .catch(error => {
            console.error('Error fetching status:', error);
            showError('Failed to get processing status');
        });
}

function showError(message) {
    document.getElementById('error-text').textContent = message;
    document.getElementById('error-message').style.display = 'block';
    document.querySelector('.spinner-border').style.display = 'none';
}

// Start polling for status updates
pollInterval = setInterval(updateStatus, 2000);
updateStatus(); // Initial call
</script>
{% endblock %}
