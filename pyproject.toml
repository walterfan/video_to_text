[tool.poetry]
name = "video-to-text"
version = "0.1.0"
description = "A Python script to convert MP4 video to text using Whisper and translate the text"
authors = ["Walter Fan <walter.fan@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10.0"
ffmpeg-python = "^0.2.0"
googletrans = "^4.0.0"
flask = "^3.0.0"
flask-wtf = "^1.1.0"
openai-whisper = "^20250625"
flask-bootstrap = "^3.3.7.1"
flask-moment = "^1.0.6"
flask-pagedown = "^0.4.0"
flask-sqlalchemy = "^3.1.1"
nest-asyncio = "^1.5.0"
flask-babel = "^4.0.0"
flask-login = "^0.6.3"
openai = "^1.0.0"
instructor = "^1.0.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.0"
httpx = "^0.27.2"
pillow = "^10.0.0"
pytesseract = "^0.3.10"
opencv-python = "^4.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
video-to-text = "video_to_text:main"
